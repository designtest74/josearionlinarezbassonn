<!DOCTYPE html>
<html lang="pt" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>José Arion Linarez | Solista & Artesano</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#CBA135', light: '#E6C265', dark: '#9E7A20' },
                        dark: { DEFAULT: '#121212D9', paper: '#1A1A1AD9', deep: '#080808D9' }
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Lato', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #080808; color: #fff; }
        
        /* Estilos Reparados para la Galería */
        .gallery-wrapper {
            position: relative;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 50px; /* Espacio para que las flechas no se corten */
        }

        .gallery-container {
            position: relative;
            overflow: hidden; /* Solo oculta las fotos de los lados, no las flechas externas */
            border-radius: 1rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .gallery-track {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gallery-slide {
            min-width: 100%;
            position: relative;
            aspect-ratio: 16 / 9;
        }

        .gallery-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7);
            transition: filter 0.5s;
        }

        .gallery-slide:hover img {
            filter: brightness(1);
        }

        /* Flechas de Navegación Reparadas */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 50; /* Prioridad máxima */
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #CBA135;
            color: #CBA135;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .nav-btn:hover {
            background: #CBA135;
            color: #000;
            box-shadow: 0 0 15px rgba(203, 161, 53, 0.4);
        }

        .prev-btn { left: -10px; }
        .next-btn { right: -10px; } /* Posicionada correctamente */

        /* Indicadores Reparados (Debajo de la foto) */
        .carousel-indicators {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 25px; /* Empuja los puntos fuera de la imagen */
        }

        .indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(203, 161, 53, 0.2);
            cursor: pointer;
            transition: all 0.3s;
        }

        .indicator.active {
            background: #CBA135;
            transform: scale(1.3);
            box-shadow: 0 0 8px rgba(203, 161, 53, 0.6);
        }

        .caption-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 30px 20px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }
    </style>
</head>
<body class="font-sans">

    <!-- Navegación Simplificada para Contexto -->
    <nav id="navbar" class="fixed w-full z-[100] transition-all duration-500 py-6 px-6 md:px-12 flex justify-between items-center">
        <div class="text-xl md:text-2xl font-serif font-bold tracking-widest">
            JOSÉ ARION LINAREZ <span class="text-gold block text-xs md:inline md:text-sm font-sans font-light italic ml-1">Bassoon</span>
        </div>
    </nav>

    <section class="pt-32 pb-20 px-6">
        <div class="max-w-4xl mx-auto text-center mb-12">
            <h2 class="text-4xl md:text-5xl font-serif mb-4">A Biblioteca <span class="italic text-gold">Fotográfica</span></h2>
            <div class="w-24 h-1 bg-gold mx-auto"></div>
        </div>

        <!-- ESTRUCTURA REPARADA -->
        <div class="gallery-wrapper">
            <!-- Botones fuera del container de recorte -->
            <button class="nav-btn prev-btn" id="prev-btn">
                <i class="fas fa-chevron-left"></i>
            </button>
            <button class="nav-btn next-btn" id="next-btn">
                <i class="fas fa-chevron-right"></i>
            </button>

            <div class="gallery-container">
                <div class="gallery-track" id="gallery-track">
                    <!-- Slide 1 -->
                    <div class="gallery-slide">
                        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=1200" alt="OSESP Performance">
                        <div class="caption-overlay">
                            <h3 class="text-2xl font-serif text-white">OSESP</h3>
                            <p class="text-gold text-sm italic">Temporada OSESP março 2026.</p>
                        </div>
                    </div>
                    <!-- Slide 2 -->
                    <div class="gallery-slide">
                        <img src="https://images.unsplash.com/photo-1507838596016-a94cfcb8489d?q=80&w=1200" alt="Maestro Ramon">
                        <div class="caption-overlay">
                            <h3 class="text-2xl font-serif text-white">Maestro Ramón Merchán</h3>
                            <p class="text-gold text-sm italic">Com meu maestro (2023).</p>
                        </div>
                    </div>
                    <!-- Slide 3 -->
                    <div class="gallery-slide">
                        <img src="https://images.unsplash.com/photo-1465847738214-513394ae81b9?q=80&w=1200" alt="Estúdio">
                        <div class="caption-overlay">
                            <h3 class="text-2xl font-serif text-white">O Atelier</h3>
                            <p class="text-gold text-sm italic">Processo criativo e artesanal.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Indicadores posicionados debajo del carrusel -->
            <div class="carousel-indicators" id="indicators-container">
                <div class="indicator active" data-index="0"></div>
                <div class="indicator" data-index="1"></div>
                <div class="indicator" data-index="2"></div>
            </div>
        </div>
    </section>

    <script>
        // Lógica del Carrusel Reparada
        const track = document.getElementById('gallery-track');
        const slides = Array.from(track.children);
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');
        const indicators = document.querySelectorAll('.indicator');
        
        let currentIdx = 0;

        function updateGallery() {
            track.style.transform = `translateX(-${currentIdx * 100}%)`;
            
            // Actualizar indicadores
            indicators.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentIdx);
            });
        }

        nextBtn.addEventListener('click', () => {
            currentIdx = (currentIdx + 1) % slides.length;
            updateGallery();
        });

        prevBtn.addEventListener('click', () => {
            currentIdx = (currentIdx - 1 + slides.length) % slides.length;
            updateGallery();
        });

        indicators.forEach(dot => {
            dot.addEventListener('click', (e) => {
                currentIdx = parseInt(e.target.dataset.index);
                updateGallery();
            });
        });

        // Auto-play suave
        setInterval(() => {
            currentIdx = (currentIdx + 1) % slides.length;
            updateGallery();
        }, 6000);
    </script>
</body>
</html>
